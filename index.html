  <style>
    :root {
      --bg-main: #0f1115; /* Глубокий, но не черный фон */
      --surface: #1a1d24; /* Мягкий темно-серый для карточек */
      --surface-hover: #222731;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2d3748;
      --accent: #38bdf8; /* Мягкий голубой неон */
      --accent-hover: #0ea5e9;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Прелоадер */
    #preloader {
      position: fixed; inset: 0; background: var(--bg-main);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.5s;
    }
    .loader-text { font-size: 1.5rem; font-weight: 800; color: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }

    .main-content {
      opacity: 0; transition: opacity 0.6s;
      max-width: 1300px; margin: 0 auto; padding: 0 20px 60px;
    }

    /* Шапка */
    .site-header {
      padding: 60px 0 40px;
      text-align: center;
    }
    .site-title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .site-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto 32px;
    }

    /* Поиск */
    .search-container {
      position: relative; max-width: 600px; margin: 0 auto 32px;
    }
    .search-input {
      width: 100%; padding: 16px 24px 16px 52px;
      border-radius: 50px; border: 1px solid var(--border);
      background: var(--surface); font-size: 1rem; color: var(--text-main);
      outline: none; transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .search-icon {
      position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 1.2rem;
    }

    /* Фильтры */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: center; margin-bottom: 48px;
    }
    .filter-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); padding: 10px 24px; border-radius: 50px;
      cursor: pointer; font-weight: 600; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      color: var(--text-main); border-color: var(--accent);
    }
    .filter-btn.active {
      background: var(--accent-gradient);
      border-color: transparent; color: #fff;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }

    /* Сетка */
    .catalog-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px;
    }

    /* Карточка */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      display: flex; flex-direction: column;
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .card-tag {
      font-size: 0.7rem; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
    }
    .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .card-brand { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; font-weight: 500; }
    
    .card-desc {
      font-size: 0.9rem; color: var(--text-muted);
      line-height: 1.6; flex-grow: 1; margin-bottom: 20px;
    }
    
    .card-footer {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--border); padding-top: 16px;
    }
    .card-price { font-weight: 800; font-size: 1.1rem; color: #fff; }
    .card-type { font-size: 0.75rem; color: var(--text-muted); background: #252a34; padding: 4px 10px; border-radius: 6px; }

    .empty-msg { text-align: center; padding: 60px; color: var(--text-muted); grid-column: 1 / -1; font-size: 1.1rem; }

    @media (max-width: 768px) {
      .site-title { font-size: 2.2rem; }
      .catalog-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('catalogGrid');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const searchInput = document.getElementById('searchInput');
      const preloader = document.getElementById('preloader');
      const mainContent = document.getElementById('mainContent');

      // Анимация загрузки
      setTimeout(() => {
        preloader.style.opacity = '0';
        setTimeout(() => {
          preloader.style.display = 'none';
          mainContent.style.opacity = '1';
        }, 500);
      }, 800);

      function renderCards() {
        const filter = document.querySelector('.filter-btn.active').dataset.filter;
        const query = searchInput.value.toLowerCase().trim();

        let filtered = catalogData;
        if (filter !== 'all') {
          filtered = filtered.filter(item => item.category === filter);
        }
        if (query) {
          filtered = filtered.filter(item =>
            item.name.toLowerCase().includes(query) ||
            item.brand.toLowerCase().includes(query) ||
            item.specs.toLowerCase().includes(query) ||
            item.desc.toLowerCase().includes(query) ||
            item.type.toLowerCase().includes(query)
          );
        }

        grid.innerHTML = '';
        if (filtered.length === 0) {
          grid.innerHTML = '<div class="empty-msg">Ничего не найдено. Попробуйте изменить запрос.</div>';
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-tag">${item.type}</div>
            <div class="card-title">${item.name}</div>
            <div class="card-brand">${item.brand} | ${item.specs}</div>
            <p class="card-desc">${item.desc}</p>
            <div class="card-footer">
              <span class="card-price">${item.price}</span>
              <span class="card-type">${item.category === 'brakes' ? 'Подвеска' : item.category === 'batteries' ? 'Питание' : item.category === 'motors' ? 'Мотор' : 'Контроллер'}</span>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      renderCards();

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCards();
        });
      });

      let debounceTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(renderCards, 150);
      });
    });
